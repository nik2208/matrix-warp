        <h1>Matrix Warp — Interactive 2D &amp; 3D Linear Algebra, Spectral Analysis, Minkowski Lp Norm &amp; Ax=b Solver Visualizer</h1>
        <p>
          Matrix Warp is an interactive mathematical and numerical linear algebra web application for visualizing 2x2 (2D) and 3x3 (3D) matrices.
        </p>
        <h2>Features</h2>
        <ul>
          <li><strong>2D &amp; 3D Determinant</strong>: Unit square/cube vs transformed parallelogram/parallelepiped with signed area/volume |det(A)| and orientation flip detection.</li>
          <li><strong>Minkowski Lp Norms (p in [1, infinity])</strong>: Continuous slider from L1 (Manhattan) to L2 (Euclidean) to L_infinity (Chebyshev), induced matrix norm ||A||_p, and condition number kappa_p(A).</li>
          <li><strong>Eigenvalues, Eigenvectors &amp; Gershgorin Discs</strong>: Real and complex spectrum on the Argand plane, spectral radius rho(A), and characteristic polynomial.</li>
          <li><strong>Direct Solvers for Ax = b</strong>: Gaussian Elimination (Naive LU, Partial Pivoting PA=LU, Complete Pivoting PAQ=LU), Cholesky Factorization (LL^T and LDL^T) with Sylvester minors, Thomas Algorithm (TDMA) for tridiagonal systems, and Cramer's Rule.</li>
          <li><strong>Iterative Solvers for Ax = b</strong>: Jacobi, Gauss-Seidel, SOR, and Conjugate Gradient (CG) with 2D/3D trajectories, diagonal dominance checks, and iteration spectral radius rho(G).</li>
        </ul>
