name: 'Bug Report / Fix per OpenCode'
description: 'Segnala un difetto o malfunzionamento da far correggere a OpenCode'
title: '[BUG]: '
labels: ['bug', 'opencode']
body:
  - type: markdown
    attributes:
      value: |
        Segnala un problema riscontrato nell'applicazione per consentire a OpenCode di riprodurlo, scrivere i test e risolverlo.
  - type: textarea
    id: problem
    attributes:
      label: Descrizione del Problema
      description: Cosa sta succedendo di anomalo?
      placeholder: Si verifica un errore imprevisto quando...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passi per Riprodurre
      description: Elenco dei passi per riprodurre il problema.
      placeholder: |
        1. Vai su...
        2. Clicca su...
        3. Si verifica l'errore...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Atteso
      description: Cosa dovrebbe invece accadere?
      placeholder: L'app dovrebbe invece...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot o Log di Errore (Opzionale)
      description: Trascina qui screenshot o incolla i log di errore.
  - type: input
    id: oc_trigger
    attributes:
      label: Comando OpenCode
      description: Lascia il comando qui sotto per avviare subito OpenCode sull'apertura dell'issue.
      value: '/oc Ripara il bug descritto e aggiungi i test di regressione'
    validations:
      required: true
